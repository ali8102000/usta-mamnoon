apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.overlaypermission'
version = '1.0.0'

android {
  namespace "expo.modules.overlaypermission"
  defaultConfig {
    minSdkVersion 24
    // Expo's module Gradle plugin expects a non-null Android versionName.
    versionName "1.0.0"
  }
}
