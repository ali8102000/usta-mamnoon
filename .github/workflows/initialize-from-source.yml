name: Initialize from Mamnoon source

# This is a manual recovery/import tool, not a recurring sync.
# Automatic runs could overwrite app-specific work after a merge.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy the original project without its workflow automation
        run: |
          git clone --depth 1 https://github.com/ali8102000/mamnoonChatGPT.git /tmp/mamnoon-source
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows/' \
            --exclude='expo-app/app.json' \
            /tmp/mamnoon-source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import stable Mamnoon baseline"
          git push
