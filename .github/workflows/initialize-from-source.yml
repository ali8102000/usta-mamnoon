name: Initialize from Mamnoon source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy the original project without its workflow automation
        run: |
          git clone --depth 1 https://github.com/ali8102000/mamnoonChatGPT.git /tmp/mamnoon-source
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows/' \
            /tmp/mamnoon-source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import stable Mamnoon baseline"
          git push
