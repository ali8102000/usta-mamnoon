name: Expo TypeScript check

on:
  pull_request:
    branches: [main]
    paths:
      - "expo-app/**"
      - ".github/workflows/expo-typecheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn
          cache-dependency-path: expo-app/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: TypeScript validation
        run: yarn tsc --noEmit
